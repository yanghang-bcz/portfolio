<script>
(async()=>{
 const frame=document.querySelector('iframe'),output=document.querySelector('#result'),results=[];
 const wait=ms=>new Promise(r=>setTimeout(r,ms));

 function check(name,ok,detail){results.push({name,pass:!!ok,...(detail?{detail}: {})});output.textContent=JSON.stringify(results,null,2);}
 async function load(width,height){frame.style.width=width+'px';frame.style.height=height+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src='../index.html?qa='+Date.now()});await frame.contentDocument.fonts.ready;await wait(300);}
 const positions=d=>[...d.querySelectorAll('.satellite')].map(e=>e.style.cssText);

 let d=frame.contentDocument,w=frame.contentWindow;
 // 分级加载后，非当前栏目的 <img> 在进入前只有 data-src、没有 src——那不是"坏图"。

 const eagerImgs=[...d.images].filter(i=>i.loading!=='lazy'&&i.getAttribute('src'));

 const resNames=()=>w.performance.getEntriesByType('resource').map(e=>e.name);
 check('Tiered loading: first Home paint requests no Music or Travel asset',
   !resNames().some(n=>/assets\/(music|travel)\//.test(n)),
   {music:resNames().filter(n=>/assets\/music\//.test(n)).length,travel:resNames().filter(n=>/assets\/travel\//.test(n)).length});
 check('Special Elite loaded',d.fonts.check('16px "Special Elite"'));
 let first=positions(d);await wait(220);check('All five satellites translate along orbit',positions(d).every((p,i)=>p!==first[i]));
 const radio=d.querySelector('[data-satellite="music"]');
 radio.dispatchEvent(new w.PointerEvent('pointerenter',{pointerType:'mouse'}));first=positions(d);await wait(180);check('Hover pauses the entire orbit',positions(d).every((p,i)=>p===first[i]));
 radio.focus();radio.dispatchEvent(new w.PointerEvent('pointerleave',{pointerType:'mouse'}));first=positions(d);await wait(180);check('Focus keeps orbit paused after mouse leaves',positions(d).every((p,i)=>p===first[i]));
 check('Keyboard focus reveals archive label',w.getComputedStyle(radio.querySelector('.archive-label')).display!=='none');
 radio.blur();first=positions(d);await wait(180);check('Orbit resumes after focus and hover leave',positions(d).every((p,i)=>p!==first[i]));
 check('No manual pause control remains in the DOM',!d.querySelector('.motion-toggle'));
 first=positions(d);await wait(180);check('Orbit keeps running with no pause control',positions(d).some((p,i)=>p!==first[i]));
 check('Astronaut drift is not paused',w.getComputedStyle(d.querySelector('.astronaut')).animationPlayState!=='paused');
 const paperBefore=rect(d.querySelector('.paper')),navBefore=rect(d.querySelector('.quick-nav'));
 const artwork=[...d.querySelectorAll('#home .asset')];const before=artwork.map(rect);
 radio.click();await wait(240);
 const shifts=artwork.map((e,i)=>rect(e).x-before[i].x);
 check('Every home visual moves by the same horizontal amount',shifts.every(s=>Math.abs(s-shifts[0])<.6)&&shifts[0]<-1,{min:Math.min(...shifts),max:Math.max(...shifts),spread:+(Math.max(...shifts)-Math.min(...shifts)).toFixed(3)});
 check('Paper and top navigation remain stationary',JSON.stringify(paperBefore)===JSON.stringify(rect(d.querySelector('.paper')))&&JSON.stringify(navBefore)===JSON.stringify(rect(d.querySelector('.quick-nav'))));
 const homeX=rect(d.querySelector('#home')).x,musicX=rect(d.querySelector('#music')).x;
 check('Incoming content and home slide together',Math.abs(musicX-homeX-1920)<2,{homeX,musicX});
 await wait(450);
 check('Satellite opens Music and moves focus',d.querySelector('.is-active').id==='music'&&d.activeElement.id==='music-title');
 check('Only current page is keyboard accessible',[...d.querySelectorAll('.page')].every(p=>p.id==='music'?!p.inert:p.inert));
 d.querySelector('#music .back-link').click();await wait(680);check('Return home works',d.querySelector('.is-active').id==='home');
 for(const route of ['about','works','music','thoughts','travel']){
   const link=d.querySelector('.quick-nav [data-route="'+route+'"]');
   link.click();
   const lit=[...d.querySelectorAll('.quick-nav a[aria-current="page"]')];
   check('Underline moves on click, not after the slide: '+route,lit.length===1&&lit[0]===link);
   await until(()=>d.querySelector('.is-active')?.id===route&&w.location.hash==='#'+route);
   check('Top navigation opens '+route,d.querySelector('.is-active').id===route&&w.location.hash==='#'+route);
   const pg=d.querySelector('#'+route),foot=pg.querySelector('.folio-footer'),col=pg.querySelector('.folio').getBoundingClientRect();
   const parts=[...(foot?foot.querySelectorAll(':scope>span'):[])],ls=foot?parseFloat(w.getComputedStyle(foot).letterSpacing)||0:0;
   const rs=parts.map(e=>e.getBoundingClientRect());
   const footOk=rs.length===3&&(()=>{const[fl,fm,fr]=rs;
     return Math.abs(fl.left-col.left)<0.6&&Math.abs(fl.bottom-fm.bottom)<0.6&&Math.abs(fm.bottom-fr.bottom)<0.6
       &&Math.abs((fm.left+fm.right)/2-(col.left+col.right)/2)<0.6
       &&fr.right>=col.right-0.6&&fr.right<=col.right+ls+0.6&&!pg.querySelector('.site-copyright');})();
   check('Footer left / centre / right aligned: '+route,footOk,rs.length===3?(()=>{const[fl,fm,fr]=rs;return{left:+(fl.left-col.left).toFixed(2),centre:+((fm.left+fm.right)/2-(col.left+col.right)/2).toFixed(2),right:+(fr.right-col.right).toFixed(2),ls};})():{parts:rs.length});
 }

 check('Section numbers follow the top navigation order',JSON.stringify(folioOrder)===JSON.stringify(navOrder),{navOrder,folioOrder});

 check('Home stickers use the same numbering',JSON.stringify(stickerOrder)===JSON.stringify(navOrder),{stickerOrder,navOrder});

// 页眉副标题是英文，必须用站点其他英文那套打字机体，而不是中文明朝体。
const wSub=d.querySelector('#works .sub-en'),wSubCS=w.getComputedStyle(wSub),wEmoji=wSub&&wSub.querySelector('.sub-emoji');
check('Works subtitle reads “From 💡 to Reality” in the typewriter face',

  {text:wSub&&wSub.textContent.trim(),font:wSubCS.fontFamily});
check('The bulb is a real emoji, not a text glyph',!!wEmoji&&w.getComputedStyle(wEmoji).fontFamily.includes('Apple Color Emoji')&&w.getComputedStyle(wEmoji).fontSize!=='13px',{font:wEmoji&&w.getComputedStyle(wEmoji).fontFamily});

  {text:vSub&&vSub.textContent.trim(),font:vSub&&w.getComputedStyle(vSub).fontFamily});
 check('Four cards link to live https URLs in a new tab',[...d.querySelectorAll('#works .card-link')].every(a=>a.href.startsWith('https:')&&a.target==='_blank'&&a.rel.includes('noopener'))&&!d.querySelector('#works').textContent.includes('City Side B'));
 const colCount=w.getComputedStyle(d.querySelector('.work-list')).gridTemplateColumns.split(' ').length;
 check('Works lays out as a 2×2 grid at 1920',colCount===2&&new Set(cards.map(c=>Math.round(rect(c).y))).size===2,{columns:colCount,rows:[...new Set(cards.map(c=>Math.round(rect(c).y)))]});
 const cardHits=cards.map(c=>{const r=rect(c),hit=d.elementFromPoint(r.x+r.w/2,r.y+r.h*0.75);return hit?(hit.className||hit.tagName):'null';});

 const fadePx=(w.getComputedStyle(d.querySelector('#works')).maskImage.match(/[\d.]+px/g)||[]).map(parseFloat);
 const fadeEnd=Math.max(...fadePx),navBox=rect(d.querySelector('.quick-nav')),folioPad=parseFloat(w.getComputedStyle(d.querySelector('#works .folio')).paddingTop);

await Promise.all(floaters.map(i=>i.complete?0:i.decode().catch(()=>{})));await wait(150);
const floatBox=d.querySelector('.music-floaters'),floatCS=w.getComputedStyle(floatBox),fl=rect(floatBox);

const flBoxes=floaters.map(rect);
check('Music keeps four torn-paper stickers in the gap between the two collections',

check('Side-by-side columns → the stickers run top-to-bottom, clear of both',
  floatCS.flexDirection==='column'&&flBoxes.every((b,i)=>i===0||b.y>flBoxes[i-1].y)&&favBox.x+favBox.w<fl.x&&fl.x+fl.w<repBox.x,
  {dir:floatCS.flexDirection,ys:flBoxes.map(b=>Math.round(b.y)),gapLeft:Math.round(fl.x-(favBox.x+favBox.w)),gapRight:Math.round(repBox.x-(fl.x+fl.w))});
const hts=floaters.map(i=>i.offsetHeight),noteH=hts.slice(0,3);
check('The gramophone outscales the three notes, which stay uniform',

const musicCovers=[...d.querySelectorAll('#music img[data-tier="music"]')];
const musicReqs=resNames().filter(n=>/assets\/music\//.test(n));
check('Tiered loading: all 16 covers arrive on first Music entry, one request each',
  musicCovers.length===16&&musicCovers.every(i=>i.complete&&i.naturalWidth>0)&&musicReqs.length===16,
  {covers:musicCovers.length,loaded:musicCovers.filter(i=>i.complete&&i.naturalWidth>0).length,requests:musicReqs.length});
const tA=floaters.map(i=>w.getComputedStyle(i).transform);await wait(450);
const tB=floaters.map(i=>w.getComputedStyle(i).transform);
check('They drift like the astronaut, each on its own phase',tA.every((v,i)=>v!==tB[i])&&new Set(floaters.map(i=>w.getComputedStyle(i).animationDuration)).size>1,
  {durations:[...new Set(floaters.map(i=>w.getComputedStyle(i).animationDuration))]});
const minGap=await(async()=>{let m=Infinity;const t0=performance.now();
  while(performance.now()-t0<1200){const bs=floaters.map(i=>i.getBoundingClientRect());
    for(let i=1;i<bs.length;i++)m=Math.min(m,bs[i].top-bs[i-1].bottom);
    await new Promise(r=>w.requestAnimationFrame(r));}
  return m;})();
check('The gap between them never closes, even mid-float',minGap>4,{minGap:+minGap.toFixed(1)});
d.querySelector('.quick-nav [data-route="about"]').click();await wait(680);
const tagItems=[...d.querySelectorAll('#about .tag-item')];
await Promise.all(tagItems.map(it=>{const img=it.querySelector('img');return img.complete?0:img.decode().catch(()=>{})}));await wait(200);
const expectedTags=['ENFJ 主人公','17375051324@163.com','github.com/yanghang-bcz','Shanghai'];
check('About lists four field tags after the intro',tagItems.length===4&&d.querySelector('#about .field-tags')?.previousElementSibling?.tagName==='P');
// 格式无关：第一阶段已把 PNG 换成 WebP（尺寸/透明通道/画面不变），所以不再断言扩展名，
// 改成真去读 alpha 通道——撕纸标签必须是带透明的位图，糊掉的纯色矩形会在这里挂掉。
check('Tag labels load as images with a real alpha channel',tagItems.every(it=>{const img=it.querySelector('img');if(!(img.complete&&img.naturalWidth>0))return false;
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height).data;
  let transparent=0;for(let i=3;i<d.length;i+=4)if(d[i]<250)transparent++;
  return transparent>c.width*c.height*0.02;}),tagItems.map(it=>it.querySelector('img').src.split('/').pop()));
check('Each tag is followed by its value',JSON.stringify(tagItems.map(it=>it.querySelector('.tag-value').textContent))===JSON.stringify(expectedTags),tagItems.map(it=>it.querySelector('.tag-value').textContent));
const tagCols=w.getComputedStyle(d.querySelector('#about .field-tags')).gridTemplateColumns.split(' ').length;
check('Field tags form a 2×2 grid on desktop',tagCols===2&&new Set(tagItems.map(it=>Math.round(rect(it).y))).size===2,{columns:tagCols});
check('Tag values never overflow their row',tagItems.every(it=>{const v=rect(it.querySelector('.tag-value')),r=rect(it);return v.x+v.w<=r.x+r.w+0.5;}),tagItems.map(it=>({v:rect(it.querySelector('.tag-value')),r:rect(it)})));
// About 的两张照片：上面那张要压住下面那张的左上角，且整体落在正文右侧的空白里。
const printBase=d.querySelector('#about .photo-print--base'),printTop=d.querySelector('#about .photo-print--top');
const tilt=el=>{const m=new w.DOMMatrixReadOnly(w.getComputedStyle(el).transform);return Math.round(Math.atan2(m.b,m.a)*1800/Math.PI)/10;};
const pb=rect(printBase),pt=rect(printTop),intro=rect(d.querySelector('.about-entry > p:not(.category)')),aboutFolio=rect(d.querySelector('#about .folio'));
const ovl={w:Math.round(Math.min(pb.x+pb.w,pt.x+pt.w)-Math.max(pb.x,pt.x)),h:Math.round(Math.min(pb.y+pb.h,pt.y+pt.h)-Math.max(pb.y,pt.y))};
check('About holds both photos as real loaded assets',[printBase,printTop].every(f=>{const i=f.querySelector('img');return i.complete&&i.naturalWidth>0&&/photo-(bamboo|selfie)\.jpg$/.test(i.getAttribute('src'));}),[printBase,printTop].map(f=>f.querySelector('img').getAttribute('src')));
check('The selfie sits on top and bites into the bamboo shot’s top-left',Number(w.getComputedStyle(printTop).zIndex)>Number(w.getComputedStyle(printBase).zIndex)&&ovl.w>100&&ovl.h>120,{overlap:ovl,z:[w.getComputedStyle(printBase).zIndex,w.getComputedStyle(printTop).zIndex]});
check('The two prints lean opposite ways, not onto a grid',tilt(printBase)<-1&&tilt(printTop)>1,{base:tilt(printBase),top:tilt(printTop)});
check('On desktop the pair sits in the right margin, clear of the text',
  pb.x>intro.x+intro.w+40&&pb.y>aboutFolio.y&&pb.y+pb.h<aboutFolio.y+aboutFolio.h,
  {photoLeft:Math.round(pb.x),textRight:Math.round(intro.x+intro.w)});
check('Neither print reaches into the copy column',[pb,pt].every(r=>r.x>=intro.x+intro.w),{photoLeft:Math.round(Math.min(pb.x,pt.x)),textRight:Math.round(intro.x+intro.w)});
 d.querySelector('.quick-nav [data-route="works"]').click();await wait(100);d.querySelector('.quick-nav [data-route="about"]').click();await wait(100);w.history.back();await wait(1450);
 check('Back during a transition preserves URL/page agreement',d.querySelector('.is-active').id===w.location.hash.slice(1),{page:d.querySelector('.is-active').id,hash:w.location.hash});
 const routeBefore=d.querySelector('.is-active').id,hashBefore=w.location.hash;d.querySelector('.skip-link').click();await wait(50);

 for(const [width,height] of [[1366,768],[390,844],[320,568],[667,375]]){

   const targets=[...d.querySelectorAll('.satellite')].map(rect),links=[...d.querySelectorAll('.quick-nav a')].map(rect);

   check(width+'×'+height+' all satellite centers reachable',targets.every(r=>r.x+r.w/2>=0&&r.x+r.w/2<=width&&r.y+r.h/2>=55&&r.y+r.h/2<=height-45));

await load(390,844);d=frame.contentDocument;w=frame.contentWindow;
d.querySelector('.quick-nav [data-route="about"]').click();await wait(700);
